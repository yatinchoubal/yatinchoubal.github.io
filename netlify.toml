[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers. The CSP allows the booking, checkout, analytics and
# newsletter providers recommended in docs/INTEGRATIONS.md. If you switch
# providers, update the relevant domains here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/resources/worksheet/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Retired service pages (catalog consolidated October 2026). Old files are in docs/archive/.
[[redirects]]
